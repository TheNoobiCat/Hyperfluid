[package]
name = "hyperfluid-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hyperfluid CLI: Command-line interface for agent and user interactions with the Hyperfluid network"

[[bin]]
name = "hyperfluid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha3.workspace = true
hex.workspace = true
ml-dsa.workspace = true
thiserror.workspace = true
parity-scale-codec.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
hyperfluid-p2p = { path = "../hyperfluid-p2p" }
hyperfluid-pdp = { path = "../hyperfluid-pdp" }
hyperfluid-state = { path = "../hyperfluid-state" }
hyperfluid-collaboration = { path = "../hyperfluid-collaboration" }

[dev-dependencies]
tempfile = "3"
