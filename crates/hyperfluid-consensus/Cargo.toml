[package]
name = "hyperfluid-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C1 Consensus Engine: Committee BFT, block production, transaction ordering, finality"

[dependencies]
serde.workspace = true
sha3.workspace = true
hex.workspace = true
parity-scale-codec.workspace = true
hyperfluid-state = { path = "../hyperfluid-state" }
hyperfluid-governance = { path = "../hyperfluid-governance" }
hyperfluid-fastpath = { path = "../hyperfluid-fastpath" }
hyperfluid-pdp = { path = "../hyperfluid-pdp" }
hyperfluid-staking = { path = "../hyperfluid-staking" }
hyperfluid-fee-market = { path = "../hyperfluid-fee-market" }
hyperfluid-p2p = { path = "../hyperfluid-p2p" }
tokio.workspace = true
tracing.workspace = true
arc-malachitebft-core-consensus = "0.7.0-pre"
arc-malachitebft-core-types = "0.7.0-pre"
arc-malachitebft-core-driver = "0.7.0-pre"
ml-dsa = { workspace = true }

[features]
default = []
# When enabled, PDP validation is skipped for all transaction types.
# Intended for testing scenarios where the full PDP state (key bindings,
# nonce tracking, quota states) is not yet wired.
pdp-bypass = []

[dev-dependencies]
serde_json.workspace = true
rand = "0.8"
