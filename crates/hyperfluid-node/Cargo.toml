[package]
name = "hyperfluid-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hyperfluid full node binary: Genesis boot, consensus loop, P2P networking, shutdown"

[[bin]]
name = "hyperfluid-node"
path = "src/main.rs"

[lib]
name = "hyperfluid_node"
path = "src/lib.rs"

[dependencies]
hyperfluid-consensus = { path = "../hyperfluid-consensus", features = ["pdp-bypass"] }
hyperfluid-state = { path = "../hyperfluid-state" }
hyperfluid-staking = { path = "../hyperfluid-staking" }
hyperfluid-p2p = { path = "../hyperfluid-p2p" }
hyperfluid-fastpath = { path = "../hyperfluid-fastpath" }
hyperfluid-governance = { path = "../hyperfluid-governance" }
arc-malachitebft-core-types = "0.7.0-pre"
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha3.workspace = true
parity-scale-codec.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
hyperfluid-fee-market = { path = "../hyperfluid-fee-market" }
hyperfluid-artifact = { path = "../hyperfluid-artifact" }
clatter.workspace = true
tracing-subscriber.workspace = true
sha3.workspace = true
hex.workspace = true
parity-scale-codec.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
