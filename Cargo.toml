[workspace]
members = [
    "crates/hyperfluid-consensus",
    "crates/hyperfluid-state",
    "crates/hyperfluid-staking",
    "crates/hyperfluid-governance",
    "crates/hyperfluid-fee-market",
    "crates/hyperfluid-fastpath",
    "crates/hyperfluid-p2p",
    "crates/hyperfluid-artifact",
    "crates/hyperfluid-pdp",
    "crates/hyperfluid-agent",
    "crates/hyperfluid-collaboration",
    "crates/hyperfluid-economics",
    "crates/hyperfluid-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/thenoobicat/hyperfluid"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
sha3 = "0.10"
hex = "0.4"
parity-scale-codec = { version = "3", features = ["derive", "max-encoded-len"] }
clatter = { version = "2.2", default-features = false, features = ["std", "use-25519", "use-chacha20poly1305", "use-sha", "use-rust-crypto-ml-kem"] }
ml-dsa = { version = "0.1.0-rc.11", default-features = false, features = ["alloc", "getrandom", "pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
