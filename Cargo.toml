[workspace]
members = [
    "crates/hyperfluid-consensus",
    "crates/hyperfluid-state",
    "crates/hyperfluid-staking",
    "crates/hyperfluid-governance",
    "crates/hyperfluid-fee-market",
    "crates/hyperfluid-fastpath",
    "crates/hyperfluid-p2p",
    "crates/hyperfluid-artifact",
    "crates/hyperfluid-pdp",
    "crates/hyperfluid-agent",
    "crates/hyperfluid-collaboration",
    "crates/hyperfluid-economics",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thenoobicat/hyperfluid"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
sha3 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
bytes = "1"
bincode = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
incremental = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
